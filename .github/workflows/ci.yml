name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.15.2"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff
        run: uv run ruff check --no-fix .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: ty
        run: uv run ty check
      - name: Pytest
        run: uv run pytest
