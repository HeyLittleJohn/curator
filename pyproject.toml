[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curator"
version = "1.0.6"
description = "Package for curating historical market data from Polygon.io to backfill into a postgres database"
authors = [{name="Jody Hirschi", email="jody@heylittlejohn.com"}]
requires-python = ">=3.14"
readme = "README.md"

dependencies = [
    "aiomultiprocess",
    "requests >=2.28.2",
    "types-requests >=2.28.11.8",
    "aiohttp >=3.8.4",
    "sentry-sdk >=1.16.0",
    "uvloop >=0.18.0",
    "pandas-market-calendars >=4.1.4",
    "scikit-learn >=1.3.0",
    "typer >=0.12.0",
    "polygon-api-client >=1.14.2",
    "pydantic >=2.4.2",
    "sqlalchemy >=2.0.0",
    "pandas >=2.2.2",
    "psycopg[binary]>=3.1.8",
    "alembic >=1.9.2",
    "zstandard>=0.25.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.1",
    "rich>=13",
]
[project.scripts]
curator = "curator.data_pipeline.main:app"

[tool.uv.sources]
aiomultiprocess = { git = "https://github.com/jhirschibar/aiomultiprocess.git", tag = "1.0.0" }

[dependency-groups]
dev = [
    "pre-commit >=3.0.4",
    "ipython >=8.14.0",
    "ipykernel >=6.26.0",
    "ruff >=0.9.8",
    "ty>=0.0.108",
    "pytest>=9.2.0",
]

[tool.ruff]
target-version = "py314"
fix = true
line-length = 120
exclude = ["alembic", "curator/thetadata/_shelved_rust"]

[tool.ruff.lint]
select = ["E", "F", "I", "B","TID252", "NPY201", "C901"]
task-tags = ["TODO", "NOTE"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# Existing mutable defaults and an unfinished Polygon refresh path. Left as-is
# so this ticket does not change how those calls behave.
"curator/data_pipeline/download.py" = ["B006"]
"curator/data_pipeline/path_runner.py" = ["B006"]
"curator/data_pipeline/polygon_utils.py" = ["B006"]
"curator/data_pipeline/uploader.py" = ["B006"]
"curator/data_pipeline/orchestrator.py" = ["F841"]
"curator/futures_ops.py" = ["B006"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
    "typer.models.OptionInfo",
    "typer.models.ArgumentInfo"
]

[tool.ruff.format]
line-ending = "auto"
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
exclude = ["curator/thetadata/_shelved_rust"]

[tool.hatch.build.targets.sdist]
exclude = ["curator/thetadata/_shelved_rust"]

[tool.ty]
baseline = "ty-baseline.json"

[tool.pytest.ini_options]
addopts = "-m 'not postgres'"
markers = [
    "postgres: scratch Postgres round-trip for the theta schema; not part of CI",
]

[tool.ty.src]
exclude = [
  "curator/thetadata/_shelved_rust/**",
  "alembic/**",
  "curator/thetadata/migrations/**",
]
