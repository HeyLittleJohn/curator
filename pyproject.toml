[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "curator"
version = "1.0.6"
description = "Package for curating historical market data from Polygon.io to backfill into a postgres database"
authors = [{name="Jody Hirschi", email="jody@heylittlejohn.com"}]
requires-python = ">=3.14"
readme = "README.md"

dependencies = [
    "aiomultiprocess",
    "requests>=2.34.2",
    "types-requests>=2.33.0.20261030",
    "aiohttp>=3.14.5",
    "sentry-sdk>=3.0.0",
    "uvloop>=0.23.0",
    "pandas-market-calendars>=5.6.1",
    "scikit-learn>=1.9.1",
    "typer>=0.29.2",
    "pydantic>=2.14.4",
    # 2.1 moved the asyncio greenlet dependency into the asyncio extra.
    "sqlalchemy[asyncio]>=2.1.9",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "alembic>=1.20.1",
    "zstandard>=0.25.0",
    "asyncpg>=0.32.0",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
]
[project.scripts]
curator = "curator.data_pipeline.main:app"

[tool.uv]
required-version = ">=0.13.9"

[tool.uv.sources]
aiomultiprocess = { git = "https://github.com/jhirschibar/aiomultiprocess.git", tag = "1.0.0" }

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ipython>=9.19.1",
    "ipykernel>=7.4.0",
    "ruff>=0.17.6",
    "ty>=0.0.108",
    "pytest>=9.2.0",
]

[tool.ruff]
target-version = "py314"
fix = true
line-length = 120
exclude = ["alembic", "curator/thetadata/_shelved_rust"]

[tool.ruff.lint]
select = ["E", "F", "I", "B","TID252", "NPY201", "C901"]
task-tags = ["TODO", "NOTE"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# Existing mutable defaults and an unfinished Polygon refresh path. Left as-is
# so this ticket does not change how those calls behave.
"curator/data_pipeline/download.py" = ["B006"]
"curator/data_pipeline/path_runner.py" = ["B006"]
"curator/data_pipeline/polygon_utils.py" = ["B006"]
"curator/data_pipeline/uploader.py" = ["B006"]
"curator/data_pipeline/orchestrator.py" = ["F841"]
"curator/futures_ops.py" = ["B006"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
    "typer.models.OptionInfo",
    "typer.models.ArgumentInfo"
]

[tool.ruff.format]
line-ending = "auto"
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
exclude = ["curator/thetadata/_shelved_rust"]

[tool.hatch.build.targets.sdist]
exclude = ["curator/thetadata/_shelved_rust"]

[tool.ty]
baseline = "ty-baseline.json"

[tool.ty.src]
exclude = [
  "curator/thetadata/_shelved_rust/**",
  "alembic/**",
  "curator/alembic/**",
]
