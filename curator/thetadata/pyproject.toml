[project]
name = "thetadata-backfill"
version = "0.1.0"
description = "High-performance ThetaData historical data backfill system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiomultiprocess>=0.9.0",
    "uvloop>=0.19.0",
    "aiohttp>=3.9.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
thetadata-backfill = "thetadata_backfill.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thetadata_backfill"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
